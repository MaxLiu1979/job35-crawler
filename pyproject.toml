[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job35-crawler"
version = "0.1.0"
description = "合规的公开招聘信号采集框架：捕捉对 35+ 求职者友好的活跃企业"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
job35 = "job35crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
