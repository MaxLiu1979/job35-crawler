      #     git config user.name "job35-bot"
      #     git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #     git checkout -b "crawl/$(date -u +%Y%m%d)"
      #     git add data/signals
      #     git commit -m "chore: weekly crawl results $(date -u +%F)"
      #     git push -u origin "HEAD:crawl/$(date -u +%Y%m%d)"
      #     gh pr create --repo MaxLiu1979/job35-directory \
      #       --title "Weekly crawl $(date -u +%F)" \
      #       --body "Automated crawl results. Review evidence before merging."
