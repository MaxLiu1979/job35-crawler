name: weekly-crawl

on:
  schedule:
    - cron: "23 3 * * 1"   # 每周一 03:23 UTC（避开整点 herd）
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: crawler

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e crawler

      # 拉取名录仓库。需要配置 secret：DIRECTORY_TOKEN（对 job35-directory 有读权限的 PAT）
      - uses: actions/checkout@v4
        with:
          repository: MaxLiu1979/job35-directory
          token: ${{ secrets.DIRECTORY_TOKEN }}
          path: directory

      - name: Crawl
        run: job35 run --companies directory/data/companies.yaml --out directory/data/signals

      - name: Open PR to directory repo
        working-directory: directory
        env:
          GH_TOKEN: ${{ secrets.DIRECTORY_TOKEN }}
        run: |
          git config user.name "job35-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="crawl/$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          git add data/signals
          git commit -m "chore: weekly crawl results $(date -u +%F)" || exit 0
          git push -u origin "HEAD:$branch"
          gh pr create --repo MaxLiu1979/job35-directory \
            --title "Weekly crawl $(date -u +%F)" \
            --body "Automated crawl results. Review evidence before merging."
